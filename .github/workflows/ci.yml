name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Some tests import the Supabase client, which needs an address; it never connects.
      - run: npm run test
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-test-placeholder

  accounting-adapters:
    name: Accounting adapter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-env supabase/functions/_shared/accounting

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
          VITE_SUPABASE_PROJECT_ID: ci-build

  test-database:
    name: Database and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The CLI is installed below; the scripts use it instead of npx.
      SUPABASE_CLI: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # supabase-js needs the WebSocket built into Node 22.
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Throwaway accounts for a throwaway database: made up per run, no secrets needed.
      - name: Make test accounts
        run: |
          pw="Ci-$(openssl rand -hex 12)"
          {
            echo "E2E_BASE_URL=http://localhost:8081"
            for r in ADMIN MANAGER STAFF CLIENT; do
              echo "E2E_${r}_EMAIL=$(echo "$r" | tr 'A-Z' 'a-z')@ci.example.test"
              echo "E2E_${r}_PASSWORD=$pw"
            done
          } > .env.e2e

      - name: Build the test database
        run: node scripts/test-db.mjs reset

      - name: Database security tests
        run: node scripts/test-db.mjs rls

      - name: End-to-end tests
        run: npx playwright test -c e2e/playwright.config.ts

      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7
