# This is the linked dev/primary Supabase project.
# To deploy schema to a NEW customer project, run:
#   supabase db push --project-ref <new-customer-project-ref>
#   supabase functions deploy --project-ref <new-customer-project-ref>
project_id = "zhlqarwjzhqzstqrnkwu"

# Every function checks who is calling it itself (and some, like signup-code
# validation and the 2FA device check, are called before sign-in), so the
# platform's own JWT check stays off. Deploys read this; without it a CLI
# update could switch the check on and break sign-up and sign-in.
# src/test/functionsConfig.test.ts fails if a function is missing here.
[functions.admin-access-review]
verify_jwt = false

[functions.admin-api]
verify_jwt = false

[functions.admin-create-user]
verify_jwt = false

