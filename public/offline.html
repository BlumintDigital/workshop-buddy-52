<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Workshop Manager — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 420px);
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
      }
      h1 { margin: 24px 0 8px; font-size: 1.75rem; }
      p { margin: 0 0 24px; color: #475569; line-height: 1.6; }
      button {
        border: 0;
        border-radius: 8px;
        padding: 11px 18px;
        background: #0f172a;
        color: #f8fafc;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        :root { background: #0f172a; color: #f8fafc; }
        p { color: #cbd5e1; }
        button { background: #f8fafc; color: #0f172a; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-192x192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Workshop records require an internet connection. Reconnect to view jobs, appointments, inventory, and invoices.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
